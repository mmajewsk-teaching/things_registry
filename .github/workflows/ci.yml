name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dev tools
        # ruff doesn't execute code; mypy uses ignore_missing_imports for torch/transformers
        run: pip install ruff mypy sqlalchemy[mypy] types-Pillow

      - name: Lint - ruff
        run: ruff check .

      - name: Type check - mypy
        run: mypy db/ api.py config.py services/
