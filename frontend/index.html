<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css">
    <title>Things Registry</title>
</head>
<body>

    <h1>Things Registry</h1>

    <div class="grid">
        <div class="card">
            <h2>Initialize Things</h2>
            <form data-endpoint="/things/initialize" data-method="POST" data-loading-text="Scanning photos and building registry…">
                <button type="submit">Initialize</button>
            </form>
        </div>

        <div class="card">
            <h2>Get Things Count</h2>
            <form data-endpoint="/things/count" data-method="GET" data-loading-text="Fetching count…">
                <button type="submit">Get Count</button>
            </form>
        </div>

        <div class="card">
            <h2>Clear Things</h2>
            <form data-endpoint="/things/clear" data-method="POST" data-loading-text="Clearing registry…">
                <button type="submit">Clear</button>
            </form>
        </div>

        <div class="card">
            <h2>Query Path</h2>
            <form data-endpoint="/query/path" data-method="POST" data-loading-text="Analysing image…">
                <label for="file">Image</label>
                <input type="file" name="file" accept="image/*" required />
                <button type="submit">Query</button>
            </form>
        </div>

        <div class="card">
            <h2>Add Path</h2>
            <form data-endpoint="/add/path" data-method="POST" data-loading-text="Uploading and registering image…">
                <label for="file">Image</label>
                <input type="file" name="file" accept="image/*" required />
                <br /><br />
                <label for="location">Location</label>
                <input name="location" placeholder="garden" required />
                <br /><br />
                <button type="submit">Add</button>
            </form>
        </div>

        <div class="card">
            <h2>Change Location</h2>
            <form data-endpoint="/query/changeloc" data-method="POST" data-loading-text="Analysing image and updating location…">
                <label for="file">Image</label>
                <input type="file" name="file" accept="image/*" required/>
                <br /><br />
                <label for="location">New location</label>
                <input name="location" placeholder="garden" required/>
                <br /><br />
                <button type="submit">Send</button>
            </form>
        </div>
    </div>

    <hr />

    <div id="spinner-wrap" class="spinner-wrap hidden">
        <div class="spinner"></div>
        <p>Analysing image…</p>
    </div>

    <div id="result-panel" class="result-panel hidden">
        <div class="tabs">
            <button class="tab-btn active" data-tab="images">Images</button>
            <button class="tab-btn" data-tab="json">JSON</button>
        </div>

        <div class="tab-content" id="tab-images">
            <div id="images-section">
                <h3>Query image</h3>
                <img id="query-img" class="query-img" alt="uploaded image" />
                <h3>Matches</h3>
                <div id="matches-grid" class="matches-grid"></div>
            </div>
        </div>

        <div class="tab-content hidden" id="tab-json">
            <pre id="output"></pre>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
